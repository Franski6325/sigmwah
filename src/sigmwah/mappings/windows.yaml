# Wazuh 4.14.7 empirically verified (ruleset files 0575-win-base_rules.xml,
# 0595-win-sysmon_rules.xml). Field names are decoder fields used in <field name="">
# (no data. prefix). Alert JSON paths are data.<decoder-field>.
logsources:
  - id: windows-sysmon-process-creation
    product: windows
    category: process_creation
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event1
  - id: windows-sysmon-file-create-time
    product: windows
    category: file_change
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event2
  - id: windows-sysmon-network
    product: windows
    category: network_connection
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event3
  - id: windows-sysmon-process-termination
    product: windows
    category: process_termination
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event5
  - id: windows-sysmon-driver-load
    product: windows
    category: driver_load
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event6
  - id: windows-sysmon-image-load
    product: windows
    category: image_load
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event7
  - id: windows-sysmon-create-remote-thread
    product: windows
    category: create_remote_thread
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event8
  - id: windows-sysmon-raw-access
    product: windows
    category: raw_access_thread
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event9
  - id: windows-sysmon-process-access
    product: windows
    category: process_access
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_10
  - id: windows-sysmon-file-event
    product: windows
    category: file_event
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_11
  - id: windows-sysmon-registry
    product: windows
    category: registry_event
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_13
  - id: windows-sysmon-registry-add
    product: windows
    category: registry_add
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_12
  - id: windows-sysmon-registry-delete
    product: windows
    category: registry_delete
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_12
  - id: windows-sysmon-registry-set
    product: windows
    category: registry_set
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_13
  - id: windows-sysmon-pipe-created
    product: windows
    category: pipe_created
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_17
  - id: windows-sysmon-wmi
    product: windows
    category: wmi_event
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_19
  - id: windows-sysmon-dns
    product: windows
    category: dns_query
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_22
  - id: windows-sysmon-file-delete
    product: windows
    category: file_delete
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_23
  - id: windows-sysmon-clipboard
    product: windows
    category: clipboard_capture
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_24
  - id: windows-sysmon-process-tampering
    product: windows
    category: process_tampering
    groups: [sigma, windows, sysmon]
    entry:
      if_group: sysmon_event_25
  - id: windows-security
    product: windows
    service: security
    groups: [sigma, windows, windows_security]
    entry:
      if_sid: "60001"
  - id: windows-system
    product: windows
    service: system
    groups: [sigma, windows]
    entry:
      if_sid: "60002"
  - id: windows-application
    product: windows
    service: application
    groups: [sigma, windows]
    entry:
      if_sid: "60003"
  - id: windows-sysmon-channel
    product: windows
    service: sysmon
    groups: [sigma, windows, sysmon]
    entry:
      if_sid: "60004"
  - id: windows-powershell
    product: windows
    service: powershell
    groups: [sigma, windows, powershell]
    entry:
      if_sid: "60000"
      fields:
        win.system.channel: "^Microsoft-Windows-PowerShell/Operational$|^Windows PowerShell$"
  - id: windows-fallback
    product: windows
    groups: [sigma, windows]
    entry:
      if_sid: "60000"

