[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigmwah"
version = "0.1.0"
description = "Convert Sigma detections (pySigma) into Wazuh 4.x analysisd XML. Honest skips, persistent SIDs, no vendored SigmaHQ rules."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Francesco Tannoia" }]
keywords = ["sigma", "wazuh", "pysigma", "siem", "detection-engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "pysigma>=1.5,<2",
  "typer>=0.12",
  "pydantic>=2.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]

[project.scripts]
sigmwah = "sigmwah.cli:app"

[project.urls]
Homepage = "https://github.com/Franski6325/sigmwah"
Documentation = "https://github.com/Franski6325/sigmwah#readme"
Issues = "https://github.com/Franski6325/sigmwah/issues"
Source = "https://github.com/Franski6325/sigmwah"
Changelog = "https://github.com/Franski6325/sigmwah/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmwah"]

[tool.hatch.build.targets.wheel.force-include]
"src/sigma/backends/wazuh/__init__.py" = "sigma/backends/wazuh/__init__.py"
"src/sigma/pipelines/wazuh/__init__.py" = "sigma/pipelines/wazuh/__init__.py"
"src/sigmwah/mappings/windows.yaml" = "sigmwah/mappings/windows.yaml"
"src/sigmwah/mappings/linux.yaml" = "sigmwah/mappings/linux.yaml"
"src/sigmwah/mappings/web.yaml" = "sigmwah/mappings/web.yaml"
"src/sigmwah/mappings/severity.yaml" = "sigmwah/mappings/severity.yaml"
"src/sigmwah/py.typed" = "sigmwah/py.typed"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "docs",
  "LICENSE",
  "NOTICE",
  "README.md",
  "CHANGELOG.md",
  "TODO.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CITATION.cff",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "--cov=sigmwah",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]
markers = [
  "docker: tests that require Docker and wazuh/wazuh-manager",
  "contract: pySigma public-API contract tests",
]

[tool.coverage.run]
source = ["sigmwah"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
"src/sigmwah/cli.py" = ["B008"]
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sigmwah"]
mypy_path = "src"
exclude = ["tests/", "src/sigma/"]

[[tool.mypy.overrides]]
module = ["sigma.*"]
ignore_missing_imports = true
follow_imports = "skip"
